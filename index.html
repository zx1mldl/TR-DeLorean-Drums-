<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLOREAN: Motor Audio Pro v3.1</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(16, 25px); gap: 3px; margin: 20px; }
        .step { width: 25px; height: 25px; background: #222; cursor: pointer; border: 1px solid #0f0; }
        .step.active { background: #0f0; }
        #controls { margin: 20px; display: flex; gap: 10px; align-items: center; }
        select, button { background: #000; color: #0f0; border: 1px solid #0f0; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>TR-DeLOREAN v3.1</h1>
    <div id="status">Cargando ROM y Sonidos...</div>
    <div id="controls">
        <select id="patternSelector" onchange="loadPattern(this.value)"></select>
        <button id="playBtn" onclick="togglePlay()">PLAY / STOP</button>
    </div>
    <div class="grid" id="grid"></div>

    <script>
        let matrix = {}, romData, isPlaying = false, stepIndex = 0;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let audioBuffers = {}; // Aquí guardaremos los sonidos cargados
        let instruments = ['Kick', 'Snare', 'ClHat', 'OpHat', 'Crash', 'LTom', 'MTom', 'HTom', 'Clap', 'Inst10', 'Inst11'];

        // Crear grid
        const gridDiv = document.getElementById('grid');
        instruments.forEach(inst => {
            matrix[inst] = new Array(16).fill(false);
            for(let i=0; i<16; i++) {
                let div = document.createElement('div');
                div.className = 'step';
                div.dataset.inst = inst; div.dataset.step = i;
                div.onclick = () => { matrix[inst][i] = !matrix[inst][i]; div.classList.toggle('active'); };
                gridDiv.appendChild(div);
            }
        });

        // Función para cargar sonidos desde GitHub
        async function loadSound(name) {
            const url = `https://raw.githubusercontent.com/zx1mldl/TR-DeLorean-Drums-/main/${name}.wav`;
            const resp = await fetch(url);
            const arrayBuffer = await resp.arrayBuffer();
            return await audioCtx.decodeAudioData(arrayBuffer);
        }

        async function init() {
            try {
                // Cargar ROM
                const romResp = await fetch('https://raw.githubusercontent.com/zx1mldl/TR-DeLorean-Drums-/main/tr505similarpatterns.BIN');
                romData = new Uint8Array(await romResp.arrayBuffer());
                
                // Cargar Sonidos
                for (let inst of instruments) {
                    try { audioBuffers[inst] = await loadSound(inst); } 
                    catch(e) { console.warn("No se encontró el sonido: " + inst); }
                }

                const selector = document.getElementById('patternSelector');
                for(let i=0; i<46; i++) {
                    let opt = document.createElement('option');
                    opt.value = i; opt.innerHTML = "Patrón " + (i + 1);
                    selector.appendChild(opt);
                }
                document.getElementById('status').innerText = "Sistema listo. ¡A darle ritmo!";
                loadPattern(0);
            } catch(e) { document.getElementById('status').innerText = "Error de carga."; }
        }

        function playSound(name) {
            if (!audioBuffers[name]) return;
            let source = audioCtx.createBufferSource();
            source.buffer = audioBuffers[name];
            source.connect(audioCtx.destination);
            source.start(0);
        }

        function togglePlay() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isPlaying = !isPlaying;
            document.getElementById('playBtn').innerText = isPlaying ? "STOP" : "PLAY";
            if (isPlaying) runSequence();
        }

        function runSequence() {
            if (!isPlaying) return;
            instruments.forEach(inst => {
                if (matrix[inst][stepIndex]) playSound(inst);
            });
            stepIndex = (stepIndex + 1) % 16;
            setTimeout(runSequence, 200);
        }

        function loadPattern(index) {
            const offset = index * 176;
            instruments.forEach((inst, i) => {
                for(let step = 0; step < 16; step++) {
                    matrix[inst][step] = (romData[offset + (i * 16) + step] > 0x15 && romData[offset + (i * 16) + step] < 0xF0);
                }
            });
            document.querySelectorAll('.step').forEach(el => {
                el.classList.toggle('active', matrix[el.dataset.inst][el.dataset.step]);
            });
        }
        init();
    </script>
</body>
</html>
