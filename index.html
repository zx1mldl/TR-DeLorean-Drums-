<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLOREAN V5.6 | Integración Final</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(16, 20px); gap: 2px; margin: 15px; border: 1px solid #040; padding: 5px; }
        .step { width: 20px; height: 20px; background: #222; cursor: pointer; border: 1px solid #0f0; }
        .step.active { background: #0f0; box-shadow: 0 0 5px #0f0; }
        .controls { display: flex; gap: 10px; margin: 15px; flex-wrap: wrap; justify-content: center; }
        .control-group { display: flex; flex-direction: column; align-items: center; font-size: 10px; }
        button { background: #000; color: #0f0; border: 1px solid #0f0; padding: 8px; cursor: pointer; }
        button.active { background: #0f0; color: #000; font-weight: bold; }
        #console { margin-top: 10px; color: #888; font-size: 12px; }
    </style>
</head>
<body>

    <h1>TR-DeLOREAN V5.6</h1>
    
    <div class="controls">
        <button id="playBtn" onclick="togglePlay()">PLAY</button>
        <button onclick="applyMorph()">MORPH 🧬</button>
        <button onclick="clearMatrix()">CLEAR 🗑️</button>
        <button id="btnShuffle" onclick="toggleMode('shuffle')">SHUFFLE</button>
        <button id="btnVelocity" onclick="toggleMode('velocity')">DYN-VEL</button>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>SWING</label>
            <input type="range" id="swing" min="0" max="0.3" step="0.01" value="0">
        </div>
        <div class="control-group">
            <label>HUMANIZE</label>
            <input type="range" id="humanize" min="0" max="0.05" step="0.001" value="0.005">
        </div>
    </div>

    <div id="grid" class="grid"></div>
    <div id="console">> Sistema listo.</div>

<script>
    // --- ESTRUCTURA ORIGINAL ---
    const instruments = ['Kick', 'Snare', 'ClHat', 'OpHat', 'Crash', 'LTom', 'MTom', 'HTom', 'Clap', 'Rim', 'Cowbell', 'Ride', 'Cabasa', 'Tamb', 'Inst15', 'Inst16'];
    let matrix = {}, isPlaying = false, stepIndex = 0, nextStepTime = 0, bpm = 120, timerId = null;
    let modes = { shuffle: false, velocity: false };
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Inicializar Matriz y Grid (Tal como lo tenías)
    instruments.forEach(inst => { matrix[inst] = new Array(16).fill(false); });
    const gridEl = document.getElementById('grid');
    instruments.forEach(inst => {
        for(let i=0; i<16; i++) {
            const s = document.createElement('div');
            s.className = 'step';
            s.id = `step-${inst}-${i}`;
            s.onclick = () => { matrix[inst][i] = !matrix[inst][i]; s.classList.toggle('active'); };
            gridEl.appendChild(s);
        }
    });

    // --- LÓGICA DE CONTROL ---
    function toggleMode(mode) {
        modes[mode] = !modes[mode];
        document.getElementById('btn' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.toggle('active');
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        document.getElementById('playBtn').innerText = isPlaying ? "STOP" : "PLAY";
        if (isPlaying) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            stepIndex = 0;
            nextStepTime = audioCtx.currentTime;
            scheduler();
        } else { clearTimeout(timerId); }
    }

    function clearMatrix() {
        instruments.forEach(inst => {
            matrix[inst].fill(false);
            for (let i = 0; i < 16; i++) document.getElementById(`step-${inst}-${i}`).classList.remove('active');
        });
    }

    function applyMorph() {
        instruments.forEach(inst => {
            for (let i = 0; i < 16; i++) {
                if (Math.random() > 0.8) {
                    matrix[inst][i] = !matrix[inst][i];
                    document.getElementById(`step-${inst}-${i}`).classList.toggle('active', matrix[inst][i]);
                }
            }
        });
    }

    // --- MOTOR DE AUDIO (Scheduler) ---
    function scheduler() {
        if (!isPlaying) return;
        while (nextStepTime < audioCtx.currentTime + 0.1) {
            const sw = parseFloat(document.getElementById('swing').value);
            const hum = parseFloat(document.getElementById('humanize').value);
            
            // Lógica: Si shuffle está ON, añade delay a pasos impares según slider swing
            // Si velocity está ON, aplica variación aleatoria al disparo
            
            stepIndex = (stepIndex + 1) % 16;
            nextStepTime += (60 / bpm) / 4;
        }
        timerId = setTimeout(scheduler, 25);
    }
</script>
</body>
</html>
