<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLOREAN V5.6 | FULL ENGINE STABLE</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(16, 22px); gap: 2px; margin: 15px; border: 1px solid #040; padding: 5px; }
        .step { width: 22px; height: 22px; background: #222; cursor: pointer; border: 1px solid #0f0; }
        .step.active { background: #0f0; box-shadow: 0 0 8px #0f0; }
        .controls { display: flex; gap: 15px; margin: 15px; justify-content: center; align-items: center; }
        .control-group { display: flex; flex-direction: column; align-items: center; font-size: 10px; }
        button { background: #000; color: #0f0; border: 1px solid #0f0; padding: 10px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0f0; color: #000; }
    </style>
</head>
<body>

    <h1>TR-DeLOREAN V5.6</h1>
    
    <div class="controls">
        <button id="playBtn" onclick="togglePlay()">PLAY</button>
        <button onclick="applyMorph()">MORPH</button>
        <button onclick="clearMatrix()">CLEAR</button>
        
        <div class="control-group">
            <label>SWING</label>
            <input type="range" id="swing" min="0" max="0.3" step="0.01" value="0">
        </div>
        <div class="control-group">
            <label>HUMANIZE</label>
            <input type="range" id="humanize" min="0" max="0.05" step="0.001" value="0.005">
        </div>
    </div>

    <div id="grid" class="grid"></div>

<script>
    const instruments = ['Kick', 'Snare', 'ClHat', 'OpHat', 'Crash', 'LTom', 'MTom', 'HTom', 'Clap', 'Rim', 'Cowbell', 'Ride', 'Cabasa', 'Tamb', 'Inst15', 'Inst16'];
    let matrix = {}, audioBuffers = {}, isPlaying = false, stepIndex = 0, nextStepTime = 0, bpm = 120, timerId = null;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // 1. Construcción de la Interfaz (INTACTA)
    const gridEl = document.getElementById('grid');
    instruments.forEach(inst => { 
        matrix[inst] = new Array(16).fill(false);
        for(let i=0; i<16; i++) {
            const s = document.createElement('div');
            s.className = 'step';
            s.id = `step-${inst}-${i}`;
            s.onclick = () => { matrix[inst][i] = !matrix[inst][i]; s.classList.toggle('active'); };
            gridEl.appendChild(s);
        }
    });

    // 2. Carga de audio estable
    async function loadSounds() {
        for (const inst of instruments) {
            try {
                const res = await fetch(`https://raw.githubusercontent.com/zx1mldl/TR-DeLorean-Drums-/main/${inst}.wav`);
                const arrayBuffer = await res.arrayBuffer();
                audioBuffers[inst] = await audioCtx.decodeAudioData(arrayBuffer);
            } catch(e) { console.error("Error carga: " + inst); }
        }
    }
    loadSounds();

    // 3. Motor de Audio Blindado
    function scheduler() {
        if (!isPlaying) return;
        while (nextStepTime < audioCtx.currentTime + 0.1) {
            const sw = parseFloat(document.getElementById('swing').value);
            const hum = parseFloat(document.getElementById('humanize').value);
            
            instruments.forEach(inst => {
                if (matrix[inst][stepIndex] && audioBuffers[inst]) {
                    const s = audioCtx.createBufferSource();
                    const g = audioCtx.createGain();
                    s.buffer = audioBuffers[inst];
                    
                    // Lógica aplicada: Shuffle (pasos pares) + Humano (Jitter) + Dinámica (Velocidad aleatoria)
                    let timeOffset = (stepIndex % 2 !== 0) ? sw * 0.15 : 0;
                    let jitter = (Math.random() - 0.5) * hum;
                    g.gain.value = 0.7 + (Math.random() * 0.3);
                    
                    s.connect(g).connect(audioCtx.destination);
                    s.start(nextStepTime + timeOffset + jitter);
                }
            });
            stepIndex = (stepIndex + 1) % 16;
            nextStepTime += (60 / bpm) / 4;
        }
        timerId = setTimeout(scheduler, 25);
    }

    function togglePlay() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isPlaying = !isPlaying;
        document.getElementById('playBtn').innerText = isPlaying ? "STOP" : "PLAY";
        if (isPlaying) { stepIndex = 0; nextStepTime = audioCtx.currentTime; scheduler(); }
        else { clearTimeout(timerId); }
    }

    function clearMatrix() {
        instruments.forEach(inst => {
            matrix[inst].fill(false);
            for(let i=0; i<16; i++) document.getElementById(`step-${inst}-${i}`).classList.remove('active');
        });
    }

    function applyMorph() {
        instruments.forEach(inst => {
            for(let i=0; i<16; i++) {
                if(Math.random() > 0.8) {
                    matrix[inst][i] = !matrix[inst][i];
                    document.getElementById(`step-${inst}-${i}`).classList.toggle('active', matrix[inst][i]);
                }
            }
        });
    }
</script>
</body>
</html>
