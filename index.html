<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLOREAN V5.6 | Original Audio Restore</title>
</head>
<body>
    <h1>TR-DeLOREAN V5.6 - Audio Engine</h1>
    <button id="playBtn" onclick="togglePlay()">PLAY / STOP</button>
    <div id="grid"></div>

<script>
    const instruments = ['Kick', 'Snare', 'ClHat', 'OpHat', 'Crash', 'LTom', 'MTom', 'HTom', 'Clap', 'Rim', 'Cowbell', 'Ride', 'Cabasa', 'Tamb', 'Inst15', 'Inst16'];
    let matrix = {}, audioBuffers = {}, isPlaying = false, stepIndex = 0, nextStepTime = 0, bpm = 120, timerId = null;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // 1. Carga de Sonidos Original
    async function loadSounds() {
        for (const inst of instruments) {
            try {
                const res = await fetch(`https://raw.githubusercontent.com/zx1mldl/TR-DeLorean-Drums-/main/${inst}.wav`);
                const arrayBuffer = await res.arrayBuffer();
                audioBuffers[inst] = await audioCtx.decodeAudioData(arrayBuffer);
            } catch(e) { console.error("Error al cargar: " + inst); }
        }
        console.log("Sounds loaded");
    }
    loadSounds();

    // 2. Disparo de Audio (Motor Original)
    function playSample(inst, time) {
        if (!audioBuffers[inst]) return;
        const s = audioCtx.createBufferSource();
        s.buffer = audioBuffers[inst];
        s.connect(audioCtx.destination);
        s.start(time);
    }

    // 3. Scheduler (Motor de tiempo)
    function scheduler() {
        while (nextStepTime < audioCtx.currentTime + 0.1) {
            instruments.forEach(inst => {
                if (matrix[inst] && matrix[inst][stepIndex]) {
                    playSample(inst, nextStepTime);
                }
            });
            stepIndex = (stepIndex + 1) % 16;
            nextStepTime += (60 / bpm) / 4;
        }
        timerId = setTimeout(scheduler, 25);
    }

    function togglePlay() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isPlaying = !isPlaying;
        if (isPlaying) {
            stepIndex = 0;
            nextStepTime = audioCtx.currentTime;
            scheduler();
        } else {
            clearTimeout(timerId);
        }
    }
</script>
</body>
</html>
