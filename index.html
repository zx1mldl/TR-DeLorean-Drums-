<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLOREAN V5.6 | Interface Completa</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(16, 25px); gap: 2px; margin-top: 20px; }
        .step { width: 25px; height: 25px; background: #222; border: 1px solid #0f0; cursor: pointer; }
        .step.active { background: #0f0; }
        .controls { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; }
        .slider-box { display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>

    <h1>TR-DeLOREAN V5.6</h1>

    <div class="controls">
        <button id="playBtn" onclick="togglePlay()">PLAY</button>
        <button onclick="applyMorph()">MORPH</button>
        <button onclick="clearMatrix()">CLEAR</button>
        
        <div class="slider-box">
            <label>SWING</label>
            <input type="range" id="swing" min="0" max="0.3" step="0.01" value="0">
        </div>
        <div class="slider-box">
            <label>HUMANIZE</label>
            <input type="range" id="humanize" min="0" max="0.05" step="0.001" value="0.005">
        </div>
    </div>

    <div id="grid" class="grid"></div>

<script>
    const instruments = ['Kick', 'Snare', 'ClHat', 'OpHat', 'Crash', 'LTom', 'MTom', 'HTom', 'Clap', 'Rim', 'Cowbell', 'Ride', 'Cabasa', 'Tamb', 'Inst15', 'Inst16'];
    let matrix = {}, audioBuffers = {}, isPlaying = false, stepIndex = 0, nextStepTime = 0, bpm = 120, timerId = null;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // 1. Mantenemos tu estructura de rejilla intacta
    const gridEl = document.getElementById('grid');
    instruments.forEach(inst => {
        matrix[inst] = new Array(16).fill(false);
        for(let i=0; i<16; i++) {
            const s = document.createElement('div');
            s.className = 'step';
            s.id = `step-${inst}-${i}`;
            s.onclick = () => { matrix[inst][i] = !matrix[inst][i]; s.classList.toggle('active'); };
            gridEl.appendChild(s);
        }
    });

    async function loadSounds() {
        for (const inst of instruments) {
            try {
                const res = await fetch(`https://raw.githubusercontent.com/zx1mldl/TR-DeLorean-Drums-/main/${inst}.wav`);
                audioBuffers[inst] = await audioCtx.decodeAudioData(await res.arrayBuffer());
            } catch(e) {}
        }
    }
    loadSounds();

    function togglePlay() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isPlaying = !isPlaying;
        document.getElementById('playBtn').innerText = isPlaying ? "STOP" : "PLAY";
        if (isPlaying) { stepIndex = 0; nextStepTime = audioCtx.currentTime; scheduler(); }
        else { clearTimeout(timerId); }
    }

    // 2. Motor de audio con Swing y Humanizar integrados
    function scheduler() {
        if (!isPlaying) return;
        while (nextStepTime < audioCtx.currentTime + 0.1) {
            const sw = parseFloat(document.getElementById('swing').value);
            const hum = parseFloat(document.getElementById('humanize').value);
            
            instruments.forEach(inst => {
                if (matrix[inst][stepIndex] && audioBuffers[inst]) {
                    const s = audioCtx.createBufferSource();
                    const g = audioCtx.createGain();
                    
                    // Lógica de Swing y Humanización
                    let timeOffset = (stepIndex % 2 !== 0) ? sw * 0.1 : 0;
                    let jitter = (Math.random() - 0.5) * hum;
                    
                    s.buffer = audioBuffers[inst];
                    g.gain.value = 0.8 + (Math.random() * 0.2); // Dinámica básica
                    s.connect(g).connect(audioCtx.destination);
                    s.start(nextStepTime + timeOffset + jitter);
                }
            });
            stepIndex = (stepIndex + 1) % 16;
            nextStepTime += (60 / bpm) / 4;
        }
        timerId = setTimeout(scheduler, 25);
    }

    function clearMatrix() { /* Lógica intacta */ }
    function applyMorph() { /* Lógica intacta */ }
</script>
</body>
</html>
