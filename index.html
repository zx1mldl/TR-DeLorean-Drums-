<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLorean v9.0 | Spark Edition</title>
    <style>
        body { background: #121212; color: #00ffcc; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        #rack-container { display: grid; grid-template-columns: repeat(2, 140px); gap: 15px; margin: 10px; }
        .bank-slot { width: 140px; height: 140px; background: #222; border: 2px solid #444; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #controls-master { margin: 20px; border: 1px solid #00ffcc; padding: 10px; display: flex; gap: 10px; }
        #sequencer { display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; width: 340px; }
        .step { width: 18px; height: 30px; border: 1px solid #444; cursor: pointer; }
        button { background: #222; color: #00ffcc; border: 1px solid #00ffcc; padding: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>TR-DeLorean v9.0</h1>
    <div id="time-switch" onclick="toggleEra()">ERA ACTUAL: PASADO</div>
    <div id="rack-container"></div>

    <div id="controls-master">
        BPM: <input type="number" id="bpm" value="120">
        Loop: <select id="loop-len" onchange="updateLoop()">
            <option value="16">16 Pasos</option>
            <option value="32">32 Pasos</option>
            <option value="64" selected>64 Pasos</option>
        </select>
        <button onclick="togglePlay()">PLAY</button>
    </div>

    <div id="sequencer-controls">
        <button onclick="changeBank(0)">1-16</button>
        <button onclick="changeBank(16)">17-32</button>
        <button onclick="changeBank(32)">33-48</button>
        <button onclick="changeBank(48)">49-64</button>
    </div>
    <div id="sequencer"></div>

    <script>
        // ESTADO
        let currentEra = 'PASADO', currentBank = 0, loopLength = 64, currentStep = 0;
        let pattern = new Array(64).fill(0);
        let isPlaying = false, nextStepTime = 0;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const samples = {};

        // INICIALIZACIÓN
        async function load() {
            const files = ['Kick.wav', 'Snare.wav', 'Closedhat.wav'];
            for(let f of files) {
                let res = await fetch(f);
                let buf = await res.arrayBuffer();
                audioCtx.decodeAudioData(buf, (b) => { samples[f] = b; });
            }
            renderRack();
            renderSequencer();
        }

        // MOTOR
        function scheduler() {
            while (nextStepTime < audioCtx.currentTime + 0.1) {
                if (pattern[currentStep]) {
                    let s = audioCtx.createBufferSource();
                    s.buffer = samples['Kick.wav'];
                    s.connect(audioCtx.destination);
                    s.start(nextStepTime);
                }
                currentStep = (currentStep + 1) % loopLength; // El bucle se ajusta aquí
                let bpm = document.getElementById('bpm').value;
                nextStepTime += 60 / (bpm * 4);
            }
            if (isPlaying) requestAnimationFrame(scheduler);
        }

        // INTERFAZ
        function updateLoop() { loopLength = parseInt(document.getElementById('loop-len').value); }
        function togglePlay() { isPlaying = !isPlaying; if(isPlaying) { nextStepTime = audioCtx.currentTime; scheduler(); } }
        function changeBank(offset) { currentBank = offset; renderSequencer(); }
        function toggleEra() { currentEra = (currentEra === 'PASADO') ? 'FUTURO' : 'PASADO'; renderRack(); }

        function renderRack() {
            const container = document.getElementById('rack-container');
            container.innerHTML = '';
            const machines = [{name:"CR-78", era:"PASADO"}, {name:"TR-505", era:"PASADO"}, {name:"TR-808", era:"FUTURO"}, {name:"TR-909", era:"FUTURO"}];
            machines.filter(m => m.era === currentEra).forEach(m => {
                let d = document.createElement('div'); d.className = 'bank-slot'; d.innerText = m.name;
                container.appendChild(d);
            });
        }

        function renderSequencer() {
            const seq = document.getElementById('sequencer');
            seq.innerHTML = '';
            for(let i = 0; i < 16; i++) {
                let idx = currentBank + i;
                let step = document.createElement('div');
                step.className = 'step';
                step.style.background = (idx >= loopLength) ? '#333' : (pattern[idx] ? '#00ffcc' : '#222');
                step.onclick = () => { pattern[idx] = pattern[idx] ? 0 : 1; renderSequencer(); };
                seq.appendChild(step);
            }
        }

        window.onload = load;
    </script>
</body>
</html>
