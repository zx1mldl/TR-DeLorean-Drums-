<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLOREAN: Motor Maestro</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(16, 30px); gap: 5px; margin: 20px; }
        .step { width: 30px; height: 30px; background: #333; cursor: pointer; border: 1px solid #0f0; }
        .step.active { background: #0f0; }
        #status { margin: 10px; font-weight: bold; color: #0f0; }
    </style>
</head>
<body>
    <h1>TR-DeLOREAN</h1>
    <div id="status">Cargando ROM desde GitHub...</div>
    <div class="grid" id="grid"></div>
    <button onclick="loadPattern(0)">CARGAR PATRÓN 0 (A-1)</button>

    <script>
        let matrix = {};
        let instruments = ['kick', 'snare', 'hihat_c', 'hihat_o', 'crash', 'ltom', 'mtom', 'htom', 'clap', 'inst10', 'inst11'];
        let romData;

        // Inicializar Grid Visual
        const gridDiv = document.getElementById('grid');
        instruments.forEach(inst => {
            matrix[inst] = new Array(16).fill(false);
            for(let i=0; i<16; i++) {
                let div = document.createElement('div');
                div.className = 'step';
                div.dataset.inst = inst;
                div.dataset.step = i;
                div.onclick = () => { matrix[inst][i] = !matrix[inst][i]; div.classList.toggle('active'); };
                gridDiv.appendChild(div);
            }
        });

        // Cargar ROM desde la URL RAW
        async function init() {
            try {
                const url = 'https://raw.githubusercontent.com/zx1mldl/TR-DeLorean-Drums-/main/tr505similarpatterns.BIN';
                const resp = await fetch(url);
                if (!resp.ok) throw new Error("No se pudo conectar con el archivo");
                
                const arrayBuffer = await resp.arrayBuffer();
                romData = new Uint8Array(arrayBuffer);
                
                document.getElementById('status').innerText = "ROM Cargada. ¡Sistema listo!";
            } catch(e) {
                document.getElementById('status').innerText = "Error: " + e.message;
            }
        }

        // Motor de inyección de patrones (176 bytes por patrón)
        function loadPattern(index) {
            if (!romData) return alert("La ROM aún no ha cargado.");
            const offset = index * 176;
            
            instruments.forEach((inst, i) => {
                for(let step=0; step<16; step++) {
                    // Si el valor del byte es > 8, lo marcamos como activo
                    matrix[inst][step] = romData[offset + (i * 16) + step] > 0x08;
                }
            });
            
            // Refrescar UI
            document.querySelectorAll('.step').forEach(el => {
                const active = matrix[el.dataset.inst][el.dataset.step];
                el.classList.toggle('active', active);
            });
            console.log("Patrón " + index + " inyectado en la matriz.");
        }

        init();
    </script>
</body>
</html>
