<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLOREAN V5.6 | Full Engine</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(16, 20px); gap: 2px; margin: 15px; border: 1px solid #040; padding: 5px; }
        .step { width: 20px; height: 20px; background: #222; cursor: pointer; border: 1px solid #0f0; }
        .step.active { background: #0f0; }
        .controls { display: flex; gap: 10px; margin: 10px; flex-wrap: wrap; justify-content: center; }
        .control-group { display: flex; flex-direction: column; align-items: center; font-size: 10px; }
        button { background: #000; color: #0f0; border: 1px solid #0f0; padding: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>TR-DeLOREAN V5.6</h1>
    <div class="controls">
        <button id="playBtn" onclick="togglePlay()">PLAY</button>
        <button onclick="applyMorph()">MORPH</button>
        <button onclick="clearMatrix()">CLEAR</button>
    </div>
    <div class="controls">
        <div class="control-group"><label>SWING</label><input type="range" id="swing" min="0" max="0.2" step="0.01" value="0"></div>
        <div class="control-group"><label>HUMANIZE</label><input type="range" id="humanize" min="0" max="0.05" step="0.001" value="0"></div>
    </div>

    <div id="grid" class="grid"></div>

<script>
    const instruments = ['Kick', 'Snare', 'ClHat', 'OpHat', 'Crash', 'LTom', 'MTom', 'HTom', 'Clap', 'Rim', 'Cowbell', 'Ride', 'Cabasa', 'Tamb', 'Inst15', 'Inst16'];
    let matrix = {}, audioBuffers = {}, isPlaying = false, stepIndex = 0, nextStepTime = 0, bpm = 120, timerId = null;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Inicialización y Grid
    instruments.forEach(inst => { 
        matrix[inst] = new Array(16).fill(false); 
        for(let i=0; i<16; i++) {
            const s = document.createElement('div');
            s.className = 'step';
            s.id = `step-${inst}-${i}`;
            s.onclick = () => { matrix[inst][i] = !matrix[inst][i]; s.classList.toggle('active'); };
            document.getElementById('grid').appendChild(s);
        }
    });

    async function loadSounds() {
        for (const inst of instruments) {
            try {
                const res = await fetch(`https://raw.githubusercontent.com/zx1mldl/TR-DeLorean-Drums-/main/${inst}.wav`);
                audioBuffers[inst] = await audioCtx.decodeAudioData(await res.arrayBuffer());
            } catch(e) {}
        }
    }
    loadSounds();

    function togglePlay() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isPlaying = !isPlaying;
        document.getElementById('playBtn').innerText = isPlaying ? "STOP" : "PLAY";
        if (isPlaying) { stepIndex = 0; nextStepTime = audioCtx.currentTime; scheduler(); }
        else { clearTimeout(timerId); }
    }

    function scheduler() {
        if (!isPlaying) return;
        while (nextStepTime < audioCtx.currentTime + 0.1) {
            const swingVal = parseFloat(document.getElementById('swing').value);
            const humVal = parseFloat(document.getElementById('humanize').value);
            
            instruments.forEach(inst => {
                if (matrix[inst][stepIndex] && audioBuffers[inst]) {
                    // Dinámica de Velocidad (aleatoria 70%-100%)
                    const velocity = 0.7 + (Math.random() * 0.3);
                    
                    // Shuffle (offset en pasos pares) + Swing + Humanize (Jitter)
                    let offset = (stepIndex % 2 !== 0 ? swingVal : 0) + ((Math.random() - 0.5) * humVal);
                    
                    const s = audioCtx.createBufferSource();
                    const g = audioCtx.createGain();
                    s.buffer = audioBuffers[inst];
                    g.gain.value = velocity;
                    s.connect(g).connect(audioCtx.destination);
                    s.start(nextStepTime + offset);
                }
            });
            stepIndex = (stepIndex + 1) % 16;
            nextStepTime += (60 / bpm) / 4;
        }
        timerId = setTimeout(scheduler, 25);
    }

    function clearMatrix() { instruments.forEach(inst => { matrix[inst].fill(false); document.querySelectorAll('.step').forEach(s => s.classList.remove('active')); }); }
    function applyMorph() { instruments.forEach(inst => { for(let i=0; i<16; i++) if(Math.random() > 0.8) { matrix[inst][i] = !matrix[inst][i]; document.getElementById(`step-${inst}-${i}`).classList.toggle('active'); }}); }
</script>
</body>
</html>
