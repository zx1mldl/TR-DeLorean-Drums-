<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TR-DeLorean v16.0 | SWING & SWING RESTORED</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>🎵 TR-DeLorean v16.0 🎸</h1>
    <div id="time-switch" title="Click para cambiar era">ERA ACTUAL: PASADO</div>
    <div id="rack-container"></div>

    <div id="controls">
        <div class="control-row">
            <div class="control-group">
                <label for="bpm">BPM:</label>
                <input type="number" id="bpm" value="120" min="40" max="300">
            </div>
            <button id="lock-btn" title="Bloquear BPM">🔓</button>
            <button id="play-btn" title="Play / Stop">▶ PLAY</button>
        </div>
        <div class="control-row">
            <div class="control-group">
                <label for="loop-len">Loop:</label>
                <select id="loop-len">
                    <option value="16">16</option>
                    <option value="32">32</option>
                    <option value="64" selected>64</option>
                </select>
            </div>
            <div class="control-group">
                <label for="swing">Swing:</label>
                <input type="range" id="swing" min="0" max="100" value="0">
            </div>
            <div class="control-group">
                <label for="humanize">Human:</label>
                <input type="range" id="humanize" min="0" max="100" value="0">
            </div>
        </div>
    </div>

    <div id="bank-nav">
        <button onclick="changeBank(0)">1-16</button>
        <button onclick="changeBank(16)">17-32</button>
        <button onclick="changeBank(32)">33-48</button>
        <button onclick="changeBank(48)">49-64</button>
    </div>
    <div id="sequencer"></div>

    <script src="script.js"></script>
</body>
</html>
