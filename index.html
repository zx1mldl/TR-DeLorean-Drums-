<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLOREAN: Motor Final v3.2</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(16, 25px); gap: 3px; margin: 20px; }
        .step { width: 25px; height: 25px; background: #222; cursor: pointer; border: 1px solid #0f0; }
        .step.active { background: #0f0; }
        #controls { margin: 20px; display: flex; gap: 10px; align-items: center; }
        select, button { background: #000; color: #0f0; border: 1px solid #0f0; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>TR-DeLOREAN v3.2</h1>
    <div id="status">Cargando...</div>
    <div id="controls">
        <select id="patternSelector" onchange="loadPattern(this.value)"></select>
        <button id="playBtn" onclick="togglePlay()">PLAY / STOP</button>
    </div>
    <div class="grid" id="grid"></div>

    <script>
        let matrix = {}, romData, isPlaying = false, stepIndex = 0;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let audioBuffers = {};
        // Lista exacta de tus 16 archivos (primera letra en mayúscula)
        let instruments = ['Kick', 'Snare', 'ClHat', 'OpHat', 'Crash', 'LTom', 'MTom', 'HTom', 'Clap', 'Rim', 'Cowbell', 'Ride', 'Cabasa', 'Tamb', 'Inst15', 'Inst16'];

        const gridDiv = document.getElementById('grid');
        instruments.forEach(inst => {
            matrix[inst] = new Array(16).fill(false);
            for(let i=0; i<16; i++) {
                let div = document.createElement('div');
                div.className = 'step';
                div.dataset.inst = inst; div.dataset.step = i;
                div.onclick = () => { matrix[inst][i] = !matrix[inst][i]; div.classList.toggle('active'); };
                gridDiv.appendChild(div);
            }
        });

        async function init() {
            try {
                // ROM (asegúrate de que el nombre del archivo aquí coincida 100% con el de GitHub)
                const romResp = await fetch('https://raw.githubusercontent.com/zx1mldl/TR-DeLorean-Drums-/main/tr505similarpatterns.BIN');
                romData = new Uint8Array(await romResp.arrayBuffer());
                
                // Carga de los 16 sonidos
                for (let inst of instruments) {
                    const url = `https://raw.githubusercontent.com/zx1mldl/TR-DeLorean-Drums-/main/${inst}.wav`;
                    const resp = await fetch(url);
                    const arrayBuffer = await resp.arrayBuffer();
                    audioBuffers[inst] = await audioCtx.decodeAudioData(arrayBuffer);
                }
                document.getElementById('status').innerText = "Sistema listo. ¡Dale al PLAY!";
                loadPattern(0);
            } catch(e) { document.getElementById('status').innerText = "Error: Verifica los nombres de archivos."; }
        }

        async function togglePlay() {
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            isPlaying = !isPlaying;
            document.getElementById('playBtn').innerText = isPlaying ? "STOP" : "PLAY";
            if (isPlaying) runSequence();
        }

        function runSequence() {
            if (!isPlaying) return;
            instruments.forEach(inst => {
                if (matrix[inst][stepIndex]) {
                    let source = audioCtx.createBufferSource();
                    source.buffer = audioBuffers[inst];
                    source.connect(audioCtx.destination);
                    source.start(0);
                }
            });
            stepIndex = (stepIndex + 1) % 16;
            setTimeout(runSequence, 200);
        }
