<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLOREAN v4.1</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(16, 20px); gap: 2px; margin: 10px; }
        .step { width: 20px; height: 20px; background: #222; cursor: pointer; border: 1px solid #0f0; }
        .step.active { background: #0f0; }
        #controls { margin: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        select, button, input { background: #000; color: #0f0; border: 1px solid #0f0; padding: 5px; }
    </style>
</head>
<body>
    <h1>TR-DeLOREAN v4.1</h1>
    <div id="status">Iniciando sistema...</div>
    <div id="controls">
        <select id="patternSelector" onchange="loadPattern(this.value)"></select>
        <button id="playBtn" onclick="togglePlay()">PLAY</button>
        <label>BPM: <input type="number" id="bpmInput" value="120" min="60" max="200" onchange="bpm = this.value"></label>
        <button id="lockBtn" onclick="toggleLock()">🔓</button>
    </div>
    <div class="grid" id="grid"></div>

    <script>
        let matrix = {}, romData, isPlaying = false, stepIndex = 0, bpm = 120, isLocked = false, timerId;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let audioBuffers = {};
        let instruments = ['Kick', 'Snare', 'ClHat', 'OpHat', 'Crash', 'LTom', 'MTom', 'HTom', 'Clap', 'Rim', 'Cowbell', 'Ride', 'Cabasa', 'Tamb', 'Inst15', 'Inst16'];

        // DIBUJAR GRID INMEDIATAMENTE
        const gridDiv = document.getElementById('grid');
        instruments.forEach(inst => {
            matrix[inst] = new Array(16).fill(false);
            for(let i=0; i<16; i++) {
                let div = document.createElement('div');
                div.className = 'step';
                div.dataset.inst = inst; div.dataset.step = i;
                div.onclick = () => { matrix[inst][i] = !matrix[inst][i]; div.classList.toggle('active'); };
                gridDiv.appendChild(div);
            }
        });

        async function init() {
            document.getElementById('status').innerText = "Cargando archivos...";
            try {
                // Carga ROM
                const romResp = await fetch('https://raw.githubusercontent.com/zx1mldl/TR-DeLorean-Drums-/main/tr505similarpatterns.BIN');
                romData = new Uint8Array(await romResp.arrayBuffer());
                
                // Carga Sonidos (Independiente)
                for (let inst of instruments) {
                    try {
                        const url = `https://raw.githubusercontent.com/zx1mldl/TR-DeLorean-Drums-/main/${inst}.wav`;
                        const resp = await fetch(url);
                        if(resp.ok) {
                            const buffer = await audioCtx.decodeAudioData(await resp.arrayBuffer());
                            audioBuffers[inst] = buffer;
                        }
                    } catch(e) { console.warn("Sonido no encontrado: " + inst); }
                }
                document.getElementById('status').innerText = "Sistema Listo.";
                loadPattern(0);
            } catch(e) { document.getElementById('status').innerText = "Error cargando ROM."; }
        }

        function toggleLock() {
            isLocked = !isLocked;
            document.getElementById('lockBtn').innerText = isLocked ? "🔒" : "🔓";
            document.getElementById('bpmInput').disabled = isLocked;
        }

        async function togglePlay() {
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            isPlaying = !isPlaying;
            document.getElementById('playBtn').innerText = isPlaying ? "STOP" : "PLAY";
            if (isPlaying) runSequence(); else clearTimeout(timerId);
        }

        function runSequence() {
            if (!isPlaying) return;
            instruments.forEach(inst => {
                if (matrix[inst][stepIndex] && audioBuffers[inst]) {
                    let source = audioCtx.createBufferSource();
                    source.buffer = audioBuffers[inst];
                    source.connect(audioCtx.destination);
                    source.start(0);
                }
            });
            stepIndex = (stepIndex + 1) % 16;
            timerId = setTimeout(runSequence, (60000 / bpm) / 4);
        }

        function loadPattern(index) {
            const offset = index * 176;
            instruments.forEach((inst, i) => {
                for(let step = 0; step < 16; step++) {
                    matrix[inst][step] = (romData[offset + (i * 16) + step] > 0x15 && romData[offset + (i * 16) + step] < 0xF0);
                }
            });
            document.querySelectorAll('.step').forEach(el => {
                el.classList.toggle('active', matrix[el.dataset.inst][el.dataset.step]);
            });
        }
        init();
    </script>
</body>
</html>
