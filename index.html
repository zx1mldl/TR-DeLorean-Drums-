<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLOREAN: V4.0 Final Engine</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(16, 20px); gap: 2px; margin: 10px; }
        .step { width: 20px; height: 20px; background: #222; cursor: pointer; border: 1px solid #0f0; }
        .step.active { background: #0f0; }
        #controls { margin: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        select, button, input { background: #000; color: #0f0; border: 1px solid #0f0; padding: 5px; }
    </style>
</head>
<body>
    <h1>TR-DeLOREAN v4.0</h1>
    <div id="status">Cargando...</div>
    <div id="controls">
        <select id="patternSelector" onchange="loadPattern(this.value)"></select>
        <button id="playBtn" onclick="togglePlay()">PLAY</button>
        <label>BPM: <input type="number" id="bpmInput" value="120" min="60" max="200" onchange="bpm = this.value"></label>
        <button id="lockBtn" onclick="toggleLock()">🔓</button>
    </div>
    <div class="grid" id="grid"></div>

    <script>
        let matrix = {}, romData, isPlaying = false, stepIndex = 0, bpm = 120, isLocked = false, timerId;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let audioBuffers = {};
        let instruments = ['Kick', 'Snare', 'ClHat', 'OpHat', 'Crash', 'LTom', 'MTom', 'HTom', 'Clap', 'Rim', 'Cowbell', 'Ride', 'Cabasa', 'Tamb', 'Inst15', 'Inst16'];

        const gridDiv = document.getElementById('grid');
        instruments.forEach(inst => {
            matrix[inst] = new Array(16).fill(false);
            for(let i=0; i<16; i++) {
                let div = document.createElement('div');
                div.className = 'step';
                div.dataset.inst = inst; div.dataset.step = i;
                div.onclick = () => { matrix[inst][i] = !matrix[inst][i]; div.classList.toggle('active'); };
                gridDiv.appendChild(div);
            }
        });

            isLocked = !isLocked;
            document.getElementById('lockBtn').innerText = isLocked ? "🔒" : "🔓";
            document.getElementById('bpmInput').disabled = isLocked;
        }
