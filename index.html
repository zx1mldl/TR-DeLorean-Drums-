<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLorean v6.0 | Estación de Ritmos</title>
    <style>
        body { background: #121212; color: #00ffcc; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; margin: 0; }
        h1 { margin-top: 30px; text-transform: uppercase; letter-spacing: 5px; }
        
        #rack-container { display: grid; grid-template-columns: repeat(4, 140px); gap: 20px; padding: 40px; border: 1px solid #333; margin: 20px; background: #1a1a1a; }
        .bank-slot { width: 140px; height: 140px; background: #222; border: 2px solid #444; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .bank-slot:hover { border-color: #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.3); }

        /* NUEVO PANEL DE CONTROL */
        #control-room { background: #000; padding: 20px; border: 2px solid #00ffcc; border-radius: 10px; width: 600px; display: flex; justify-content: space-around; }
        button { background: #333; color: #00ffcc; border: 1px solid #00ffcc; padding: 10px 20px; cursor: pointer; font-family: inherit; }
        button:hover { background: #00ffcc; color: #000; }
    </style>
</head>
<body>

    <h1>TR-DeLorean v6.0</h1>
    <div id="rack-container"></div>

    <div id="control-room">
        <button onclick="playMachine()">PLAY</button>
        <button onclick="stopMachine()">STOP</button>
        <div id="bpm-display">BPM: 120</div>
    </div>
    <div id="status-panel" style="margin-top:20px;">Sistema: Listo para carga de ADN rítmico</div>

    <script>
        const banks = [
            { name: "Bardet 260", id: "bardet" },
            { name: "Tokyo Test", id: "tokyo" },
            { name: "Witness Rhythm", id: "witness" },
            { name: "CR-78 Vintage", id: "cr78" }
        ];

        function initRack() {
            const container = document.getElementById('rack-container');
            banks.forEach(bank => {
                const div = document.createElement('div');
                div.className = 'bank-slot';
                div.innerHTML = `<span>${bank.name}</span>`;
                div.onclick = () => loadBank(bank);
                container.appendChild(div);
            });
        }

        function playMachine() { console.log("Iniciando secuencia..."); }
        function stopMachine() { console.log("Deteniendo motor..."); }

        function loadBank(bank) {
            document.getElementById('status-panel').innerText = `Banco activo: ${bank.name}`;
        }

        window.onload = initRack;
    </script>
</body>
</html>
