<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLorean v8.1 | FULL SYSTEM</title>
    <style>
        body { background: #121212; color: #00ffcc; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        h1 { margin-top: 0; text-transform: uppercase; letter-spacing: 5px; font-size: 20px; }
        
        #time-switch { margin: 10px; padding: 10px 20px; border: 2px solid #00ffcc; cursor: pointer; background: #000; color: #00ffcc; font-weight: bold; }
        #rack-container { display: grid; grid-template-columns: repeat(2, 140px); gap: 15px; margin: 10px; }
        .bank-slot { width: 140px; height: 140px; background: #222; border: 2px solid #444; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 11px; }
        .bank-slot:hover { border-color: #00ffcc; }
        
        #controls-master { margin: 20px; display: flex; gap: 10px; align-items: center; border: 1px solid #00ffcc; padding: 10px; }
        #sequencer-controls { display: flex; gap: 5px; margin-bottom: 10px; }
        #sequencer { display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; width: 340px; }
        .step { width: 18px; height: 30px; border: 1px solid #444; cursor: pointer; }
        
        button { background: #222; color: #00ffcc; border: 1px solid #00ffcc; padding: 8px 10px; cursor: pointer; }
        button:active { background: #00ffcc; color: #000; }
        input { width: 50px; background: #000; color: #00ffcc; border: 1px solid #00ffcc; }
    </style>
</head>
<body>

    <h1>TR-DeLorean v8.1</h1>
    
    <div id="time-switch" onclick="toggleEra()">ERA ACTUAL: PASADO</div>
    
    <div id="rack-container"></div>

    <div id="controls-master">
        BPM: <input type="number" id="bpm-input" value="120" min="60" max="240">
        <button id="lock-btn" onclick="toggleLock()">🔓</button>
        <button onclick="togglePlay()">PLAY / STOP</button>
    </div>

    <div id="sequencer-controls">
        <button onclick="changeBank(0)">1-16</button>
        <button onclick="changeBank(16)">17-32</button>
        <button onclick="changeBank(32)">33-48</button>
        <button onclick="changeBank(48)">49-64</button>
    </div>
    <div id="sequencer"></div>

    <script>
        const machines = [
            { name: "CR-78", id: "cr78", era: "PASADO" },
            { name: "LinnDrum", id: "linndrum", era: "PASADO" },
            { name: "TR-505", id: "tr505", era: "PASADO" },
            { name: "TR-808", id: "tr808", era: "FUTURO" },
            { name: "TR-909", id: "tr909", era: "FUTURO" },
            { name: "DMX", id: "dmx", era: "FUTURO" }
        ];

        let currentEra = 'PASADO', currentBankOffset = 0, patternState = new Array(64).fill(0);
        let isPlaying = false, isLocked = false, currentStep = 0, clockInterval;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const samples = {};
        const sampleFiles = ['Kick.wav', 'Snare.wav', 'Closedhat.wav'];

        async function preloadSamples() {
            for (const file of sampleFiles) {
                try {
                    const response = await fetch(file);
                    const arrayBuffer = await response.arrayBuffer();
                    audioCtx.decodeAudioData(arrayBuffer, (buffer) => { samples[file] = buffer; });
                } catch(e) {}
            }
        }

        function toggleLock() {
            isLocked = !isLocked;
            document.getElementById('lock-btn').innerText = isLocked ? '🔒' : '🔓';
            document.getElementById('bpm-input').disabled = isLocked;
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            if (isPlaying) {
                const bpm = document.getElementById('bpm-input').value;
                clockInterval = setInterval(playStep, (60000 / bpm) / 4);
            } else {
                clearInterval(clockInterval);
            }
        }

        function playStep() {
            if (patternState[currentStep]) {
                const source = audioCtx.createBufferSource();
                source.buffer = samples['Kick.wav'];
                source.connect(audioCtx.destination);
                source.start(0);
            }
            currentStep = (currentStep + 1) % 64;
            renderSequencer();
        }

        function toggleEra() {
            currentEra = (currentEra === 'PASADO') ? 'FUTURO' : 'PASADO';
            document.getElementById('time-switch').innerText = `ERA ACTUAL: ${currentEra}`;
            renderRack();
        }

        function renderRack() {
            const container = document.getElementById('rack-container');
            container.innerHTML = '';
            machines.filter(m => m.era === currentEra).forEach(m => {
                const div = document.createElement('div');
                div.className = 'bank-slot';
                div.innerHTML = m.name;
                div.onclick = () => console.log("Máquina: " + m.name);
                container.appendChild(div);
            });
        }

        function changeBank(offset) { currentBankOffset = offset; renderSequencer(); }

        function renderSequencer() {
            const seq = document.getElementById('sequencer');
            seq.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const stepIndex = currentBankOffset + i;
                const step = document.createElement('div');
                step.className = 'step';
                if (stepIndex === currentStep) step.style.background = '#ffcc00';
                else step.style.background = patternState[stepIndex] ? '#00ffcc' : '#222';
                step.onclick = () => { patternState[stepIndex] = patternState[stepIndex] ? 0 : 1; renderSequencer(); };
                seq.appendChild(step);
            }
        }

        window.onload = () => { preloadSamples(); renderRack(); renderSequencer(); };
    </script>
</body>
</html>
