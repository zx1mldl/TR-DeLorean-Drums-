<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLorean v6.0 | Estación de Ritmos</title>
    <style>
        body { background: #1a1a1a; color: #00ffcc; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; }
        #rack-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 40px; }
        .bank-slot { 
            width: 150px; height: 150px; background: #333; border: 2px solid #555; 
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.3s; text-align: center; border-radius: 10px;
        }
        .bank-slot:hover { background: #444; border-color: #00ffcc; box-shadow: 0 0 15px #00ffcc; }
        h1 { margin-top: 50px; text-transform: uppercase; letter-spacing: 5px; }
    </style>
</head>
<body>

    <h1>TR-DeLorean v6.0</h1>
    <div id="rack-container"></div>

    <script>
        // --- Lógica del Motor v6.0 ---
        const banks = [
            { name: "Bardet 260", id: "bardet" },
            { name: "Tokyo Test", id: "tokyo" },
            { name: "Witness Rhythm", id: "witness" },
            { name: "CR-78 Vintage", id: "cr78" }
        ];

        function initRack() {
            const container = document.getElementById('rack-container');
            banks.forEach(bank => {
                const div = document.createElement('div');
                div.className = 'bank-slot';
                div.innerHTML = `<div>${bank.name}</div>`;
                div.onclick = () => console.log(`Iniciando motor de carga para: ${bank.name}`);
                container.appendChild(div);
            });
        }

        // Inicializar al cargar
        window.onload = initRack;
    </script>
</body>
</html>
