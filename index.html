<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLorean v6.0 | Estación de Ritmos</title>
    <style>
        body { background: #121212; color: #00ffcc; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; margin: 0; }
        h1 { margin-top: 30px; text-transform: uppercase; letter-spacing: 5px; }
        
        #rack-container { display: grid; grid-template-columns: repeat(4, 140px); gap: 20px; padding: 40px; border: 1px solid #333; margin: 20px; background: #1a1a1a; }
        
        .bank-slot { width: 140px; height: 140px; background: #222; border: 2px solid #444; border-radius: 8px; 
                     display: flex; align-items: center; justify-content: center; cursor: pointer; 
                     transition: 0.3s; text-align: center; }
        
        .bank-slot:hover { border-color: #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.3); }
        
        #status-panel { margin-top: 20px; padding: 15px; border: 1px solid #00ffcc; border-radius: 5px; width: 80%; text-align: center; }
    </style>
</head>
<body>

    <h1>TR-DeLorean v6.0</h1>
    <div id="rack-container"></div>
    <div id="status-panel">Sistema: Listo para carga de ADN rítmico</div>

    <script>
        // CONFIGURACIÓN DE BANCOS
        const banks = [
            { name: "Bardet 260", id: "bardet" },
            { name: "Tokyo Test", id: "tokyo" },
            { name: "Witness Rhythm", id: "witness" },
            { name: "CR-78 Vintage", id: "cr78" }
        ];

        // 1. INICIALIZADOR DEL RACK
        function initRack() {
            const container = document.getElementById('rack-container');
            banks.forEach(bank => {
                const div = document.createElement('div');
                div.className = 'bank-slot';
                div.innerHTML = `<span>${bank.name}</span>`;
                div.onclick = () => loadBank(bank);
                container.appendChild(div);
            });
        }

        // 2. MOTOR DE PARSER MIDI (FASE B)
        async function loadBank(bank) {
            const status = document.getElementById('status-panel');
            status.innerText = `Cargando ADN rítmico: ${bank.name}...`;
            
            console.log(`Iniciando secuencia para: ${bank.id}`);
            
            // Simulación de lectura de bytes (Parser MIDI)
            try {
                // Aquí llamaremos a tu archivo MIDI en el futuro
                await simulateMidiParse(bank.id);
                status.innerText = `ÉXITO: Banco ${bank.name} cargado correctamente.`;
            } catch (err) {
                status.innerText = `ERROR: Fallo en la lectura del archivo.`;
            }
        }

        function simulateMidiParse(id) {
            return new Promise(resolve => setTimeout(resolve, 1000));
        }

        // INICIAR AL CARGAR
        window.onload = initRack;
    </script>
</body>
</html>
