<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLOREAN V5.6 - Fusión Engine</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(16, 20px); gap: 2px; margin: 15px; border: 1px solid #040; padding: 5px; }
        .step { width: 20px; height: 20px; background: #222; cursor: pointer; border: 1px solid #0f0; transition: 0.1s; }
        .step.active { background: #0f0; box-shadow: 0 0 5px #0f0; }
        .step.playing { border-color: #fff; transform: scale(1.1); }
        #controls { margin: 15px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 600px; }
        .slider-group { display: flex; flex-direction: column; align-items: center; font-size: 10px; width: 85px; }
        button { background: #000; color: #0f0; border: 1px solid #0f0; padding: 8px; cursor: pointer; font-family: monospace; }
    </style>
</head>
<body>

    <h1>TR-DeLOREAN v5.6 (Engine v18.3)</h1>
    <div id="controls">
        <button id="playBtn" onclick="togglePlay()">PLAY/STOP</button>
        <button onclick="applyMorph()">MORPH 🧬</button>
        <button onclick="clearMatrix()">CLEAR 🗑️</button>
        <div class="slider-group">
            <label>SWING</label>
            <input type="range" id="swing" min="0" max="0.2" step="0.01" value="0">
        </div>
        <div class="slider-group">
            <label>HUMAN</label>
            <input type="range" id="humanize" min="0" max="0.02" step="0.001" value="0.005">
        </div>
    </div>

    <div id="grid" class="grid"></div>
    <div id="console">> Motor listo. Cargando sonidos...</div>

<script>
    const instruments = ['Kick', 'Snare', 'ClHat', 'OpHat', 'Crash', 'LTom', 'MTom', 'HTom', 'Clap', 'Rim', 'Cowbell', 'Ride', 'Cabasa', 'Tamb', 'Inst15', 'Inst16'];
    let matrix = {}, audioBuffers = {}, isPlaying = false, stepIndex = 0, bpm = 120, nextStepTime = 0.0, timerId = null;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Inicializar Matriz
    instruments.forEach(inst => { matrix[inst] = new Array(16).fill(false); });

    // Crear Grid
    const gridEl = document.getElementById('grid');
    instruments.forEach(inst => {
        for(let i=0; i<16; i++) {
            const s = document.createElement('div');
            s.className = 'step';
            s.id = `step-${inst}-${i}`;
            s.onclick = () => {
                matrix[inst][i] = !matrix[inst][i];
                s.classList.toggle('active');
            };
            gridEl.appendChild(s);
        }
    });

    function log(m) { document.getElementById('console').innerHTML = `> ${m}`; }

    // Motor de Audio original
    function scheduleStep(step, time) {
        const sw = parseFloat(document.getElementById('swing').value);
        const hum = parseFloat(document.getElementById('humanize').value);
        const timeOffset = (step % 2 !== 0) ? sw * (60 / bpm / 4) : 0;
        const jitter = (Math.random() - 0.5) * hum;

        instruments.forEach(inst => {
            if (matrix[inst][step] && audioBuffers[inst]) {
                const g = audioCtx.createGain();
                g.gain.value = (step % 4 === 0) ? 1.3 : 0.8;
                const s = audioCtx.createBufferSource();
                s.buffer = audioBuffers[inst];
                s.connect(g).connect(audioCtx.destination);
                s.start(time + timeOffset + jitter);
            }
        });
    }

    // Integración Engine v18.3 (Control de Scheduler)
    function scheduler() {
        while (nextStepTime < audioCtx.currentTime + 0.1) {
            scheduleStep(stepIndex, nextStepTime);
            stepIndex = (stepIndex + 1) % 16;
            nextStepTime += (60 / bpm) / 4;
        }
        timerId = setTimeout(scheduler, 25);
    }

    function togglePlay() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isPlaying = !isPlaying;
        document.getElementById('playBtn').innerText = isPlaying ? "STOP" : "PLAY";
        if (isPlaying) { stepIndex = 0; nextStepTime = audioCtx.currentTime; scheduler(); }
        else { clearTimeout(timerId); }
    }

    async function loadSounds() {
        for (const inst of instruments) {
            try {
                const res = await fetch(`https://raw.githubusercontent.com/zx1mldl/TR-DeLorean-Drums-/main/${inst}.wav`);
                audioBuffers[inst] = await audioCtx.decodeAudioData(await res.arrayBuffer());
            } catch(e) {}
        }
        log("ROM CARGADA. TR-DELOREAN V5.6 READY.");
    }
    loadSounds();
</script>
</body>
</html>
