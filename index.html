<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLorean Diagnóstico</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        #log { border: 1px solid #0f0; padding: 10px; height: 200px; overflow-y: scroll; }
    </style>
</head>
<body>
    <h1>TR-DeLOREAN DIAGNÓSTICO</h1>
    <button onclick="iniciarMaquina()">INICIAR MÁQUINA</button>
    <div id="log"></div>

    <script>
        const logDiv = document.getElementById('log');
        function logger(msg) { logDiv.innerHTML += msg + "<br>"; console.log(msg); }

        async function iniciarMaquina() {
            logger("Iniciando...");
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                logger("AudioContext creado: " + audioCtx.state);
                
                const inst = 'kick'; // Probemos primero con un solo archivo
                const resp = await fetch(inst + '.wav');
                
                if (!resp.ok) throw new Error("Error HTTP: " + resp.status);
                
                const buffer = await audioCtx.decodeAudioData(await resp.arrayBuffer());
                logger("Audio decodificado correctamente.");
                
                const src = audioCtx.createBufferSource();
                src.buffer = buffer;
                src.connect(audioCtx.destination);
                src.start(0);
                logger("¡Sonido disparado!");
            } catch (e) {
                logger("ERROR: " + e.message);
            }
        }
    </script>
</body>
</html>
