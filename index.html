<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLOREAN V5.1 - Stable Engine</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(16, 20px); gap: 2px; margin: 15px; }
        .step { width: 20px; height: 20px; background: #222; cursor: pointer; border: 1px solid #0f0; }
        .step.active { background: #0f0; }
        #controls { margin: 15px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        button, input { background: #000; color: #0f0; border: 1px solid #0f0; padding: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>TR-DeLOREAN v5.1</h1>
    <div id="controls">
        <button id="playBtn" onclick="togglePlay()">PLAY</button>
        <button onclick="applyMorph()">MORPH 🧬</button>
        <label>Swing: <input type="range" id="swing" min="0" max="0.2" step="0.01" value="0"></label>
        <label>Hum: <input type="range" id="humanize" min="0" max="0.02" step="0.001" value="0"></label>
    </div>
    <div class="grid" id="grid"></div>

    <script>
        const instruments = ['Kick', 'Snare', 'ClHat', 'OpHat', 'Crash', 'LTom', 'MTom', 'HTom', 'Clap', 'Rim', 'Cowbell', 'Ride', 'Cabasa', 'Tamb', 'Inst15', 'Inst16'];
        let matrix = {}, audioBuffers = {}, isPlaying = false, stepIndex = 0, bpm = 120, nextStepTime = 0.0;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // 1. Inicialización de UI y Matriz
        const gridDiv = document.getElementById('grid');
        instruments.forEach(inst => {
            matrix[inst] = new Array(16).fill(false);
            for(let i = 0; i < 16; i++) {
                let div = document.createElement('div');
                div.className = 'step';
                div.dataset.inst = inst; div.dataset.step = i;
                div.onclick = () => { matrix[inst][i] = !matrix[inst][i]; div.classList.toggle('active'); };
                gridDiv.appendChild(div);
            }
        });

        // 2. Motor de Audio de Precisión
        function scheduler() {
            while (nextStepTime < audioCtx.currentTime + 0.1) {
                scheduleStep(stepIndex, nextStepTime);
                nextStep();
            }
            setTimeout(scheduler, 25);
        }

        function scheduleStep(step, time) {
            const swing = parseFloat(document.getElementById('swing').value);
            const hum = parseFloat(document.getElementById('humanize').value);
            const timeOffset = (step % 2 !== 0) ? swing * (60 / bpm / 4) : 0;
            const jitter = (Math.random() - 0.5) * hum;

            instruments.forEach(inst => {
                if (matrix[inst][step] && audioBuffers[inst]) {
                    const gainNode = audioCtx.createGain();
                    gainNode.gain.value = (step % 4 === 0) ? 1.2 : 0.8;
                    const source = audioCtx.createBufferSource();
                    source.buffer = audioBuffers[inst];
                    source.connect(gainNode).connect(audioCtx.destination);
                    source.start(time + timeOffset + jitter);
                }
            });
        }

        function nextStep() {
            nextStepTime += 0.25 * (60.0 / bpm);
            stepIndex = (stepIndex + 1) % 16;
        }

        // 3. Controles
        function togglePlay() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isPlaying = !isPlaying;
            document.getElementById('playBtn').innerText = isPlaying ? "STOP" : "PLAY";
            if (isPlaying) { nextStepTime = audioCtx.currentTime; scheduler(); }
        }

        function applyMorph() {
            instruments.forEach(inst => {
                for(let i = 0; i < 16; i++) {
                    if(Math.random() > 0.85) matrix[inst][i] = !matrix[inst][i];
                }
            });
            document.querySelectorAll('.step').forEach(el => {
                el.classList.toggle('active', matrix[el.dataset.inst][el.dataset.step]);
            });
        }

        async function loadSounds() {
            for (const inst of instruments) {
                try {
                    const res = await fetch(`https://raw.githubusercontent.com/zx1mldl/TR-DeLorean-Drums-/main/${inst}.wav`);
                    audioBuffers[inst] = await audioCtx.decodeAudioData(await res.arrayBuffer());
                } catch(e) { console.warn(`Error carga: ${inst}`); }
            }
        }
        loadSounds();
    </script>
</body>
</html>
