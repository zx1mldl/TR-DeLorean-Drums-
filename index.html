<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLorean v6.5 | 64 Step Sequencer</title>
    <style>
        body { background: #121212; color: #00ffcc; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; margin: 0; }
        h1 { margin-top: 20px; text-transform: uppercase; letter-spacing: 5px; font-size: 20px; }
        
        #sequencer-controls { margin: 15px; display: flex; gap: 10px; }
        button { background: #222; color: #00ffcc; border: 1px solid #00ffcc; padding: 8px 15px; cursor: pointer; font-weight: bold; }
        button:active { background: #00ffcc; color: #000; }
        
        #sequencer { display: grid; grid-template-columns: repeat(16, 1fr); gap: 2px; width: 340px; margin-top: 10px; }
        .step { width: 18px; height: 30px; border: 1px solid #444; cursor: pointer; }
        
        #status-panel { margin-top: 20px; padding: 10px; border: 1px solid #00ffcc; width: 300px; text-align: center; }
        #control-room { margin-top: 15px; padding: 15px; border: 2px solid #00ffcc; width: 300px; display: flex; flex-direction: column; gap: 10px; background: #000; }
    </style>
</head>
<body>

    <h1>TR-DeLorean v6.5</h1>

    <div id="sequencer-controls">
        <button onclick="changeBank(0)">1-16</button>
        <button onclick="changeBank(16)">17-32</button>
        <button onclick="changeBank(32)">33-48</button>
        <button onclick="changeBank(48)">49-64</button>
    </div>

    <div id="sequencer"></div>
    <div id="status-panel">Sistema: Listo.</div>

    <div id="control-room">
        <button onclick="playSample('Kick.wav')">TEST KICK (TR-505)</button>
    </div>

    <script>
        // 1. Configuración y Motor de Audio
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const samples = {};
        const sampleFiles = ['Kick.wav', 'Snare.wav', 'Closedhat.wav', 'Openhat.wav', 'Handclap.wav', 'Ride.wav', 'Crash.wav', 'Rim.wav'];
        
        // Estado del secuenciador (64 pasos)
        let currentBankOffset = 0;
        let patternState = new Array(64).fill(0);

        async function preloadSamples() {
            for (const file of sampleFiles) {
                try {
                    const response = await fetch(file);
                    const arrayBuffer = await response.arrayBuffer();
                    audioCtx.decodeAudioData(arrayBuffer, (buffer) => { samples[file] = buffer; });
                } catch(e) { console.error("Error al cargar: " + file); }
            }
        }

        function playSample(fileName) {
            if (!samples[fileName]) { alert("Archivo no cargado"); return; }
            const source = audioCtx.createBufferSource();
            source.buffer = samples[fileName];
            source.connect(audioCtx.destination);
            source.start(0);
        }

        // 2. Lógica del Secuenciador
        function changeBank(offset) {
            currentBankOffset = offset;
            renderSequencer();
        }

        function renderSequencer() {
            const seq = document.getElementById('sequencer');
            seq.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const stepIndex = currentBankOffset + i;
                const step = document.createElement('div');
                step.className = 'step';
                // Estado visual
                step.style.background = patternState[stepIndex] ? '#00ffcc' : '#222';
                
                step.onclick = () => {
                    patternState[stepIndex] = patternState[stepIndex] ? 0 : 1;
                    step.style.background = patternState[step
