<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Secuenciador v5.3 + Engine v18.3</title>
    <style>
        body { font-family: 'Verdana', sans-serif; background: #000; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: auto; border: 1px solid #333; padding: 20px; background: #121212; }
        h1 { color: #ff9900; font-size: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        /* Rejilla del Step Sequencer (Visual v5.3) */
        .sequencer-grid { display: grid; grid-template-columns: repeat(16, 1fr); gap: 4px; margin: 20px 0; }
        .step { height: 40px; background: #222; border: 1px solid #444; cursor: pointer; }
        .step.active { background: #ff9900; }
        
        .controls { display: flex; gap: 10px; }
        .mode-btn { background: #222; border: 1px solid #444; color: #fff; padding: 10px; cursor: pointer; }
        .mode-btn.on { background: #ff9900; color: #000; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Step Sequencer v5.3 (Engine v18.3)</h1>
    
    <div class="sequencer-grid" id="grid"></div>

    <div class="controls">
        <button class="mode-btn" id="btnShuffle" onclick="engine.toggleModo('modoShuffle')">Shuffle</button>
        <button class="mode-btn" id="btnVelocidad" onclick="engine.toggleModo('modoVelocidad')">Velocidad</button>
        <button class="mode-btn" id="btnSwing" onclick="engine.toggleModo('modoSwing')">Swing</button>
    </div>
</div>

<script>
    class PatronesEngine {
        constructor() {
            this.config = {
                modoShuffle: { activo: false, id: "btnShuffle" },
                modoVelocidad: { activo: false, id: "btnVelocidad" },
                modoSwing: { activo: false, id: "btnSwing" }
            };

            this.library = {
                "Beat 1": { bpm: 97, notes: [{"time":0,"note":"D2"},{"time":0.309,"note":"G2"},{"time":0.618,"note":"F2"},{"time":0.927,"note":"G2"}] },
                "Beat 2": { bpm: 101, notes: [{"time":0,"note":"D2"},{"time":0.297,"note":"F#2"},{"time":0.594,"note":"F2"},{"time":0.891,"note":"D2"}] },
                "Beat 3": { bpm: 108, notes: [{"time":0,"note":"D2"},{"time":0.277,"note":"F#2"},{"time":0.416,"note":"F#2"},{"time":0.555,"note":"F2"}] },
                "Beat 4": { bpm: 98, notes: [{"time":0,"note":"D2"},{"time":0.153,"note":"F#2"},{"time":0.459,"note":"E2"},{"time":0.765,"note":"F#2"}] },
                "Beat 5": { bpm: 98, notes: [{"time":0,"note":"D2"},{"time":0.102,"note":"F#2"},{"time":0.408,"note":"E2"},{"time":0.714,"note":"F#2"}] }
            };
            
            this.crearGrid();
        }

        crearGrid() {
            const grid = document.getElementById('grid');
            for (let i = 0; i < 16; i++) {
                const step = document.createElement('div');
                step.className = 'step';
                step.onclick = () => step.classList.toggle('active');
                grid.appendChild(step);
            }
        }

        toggleModo(nombreModo) {
            const modo = this.config[nombreModo];
            modo.activo = !modo.activo;
            document.getElementById(modo.id).classList.toggle('on', modo.activo);
        }
    }

    const engine = new PatronesEngine();
</script>
</body>
</html>
