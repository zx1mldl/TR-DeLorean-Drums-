<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TR-DeLOREAN v5.6 - Control Total</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(16, 22px); gap: 2px; margin: 10px; border: 1px solid #040; padding: 5px; }
        .step { width: 22px; height: 22px; background: #111; cursor: pointer; border: 1px solid #0f0; }
        .step.active { background: #0f0; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        button { background: #111; color: #0f0; border: 1px solid #0f0; padding: 10px; cursor: pointer; }
        button.active { background: #0f0; color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <h1>TR-DeLOREAN v5.6</h1>
    <div class="controls">
        <button id="btn-play" onclick="togglePlay()">PLAY</button>
        <button id="btn-shuffle" onclick="toggleFeature('shuffle')">SHUFFLE</button>
        <button id="btn-velocity" onclick="toggleFeature('velocity')">DYN-VEL</button>
        <button id="btn-swing" onclick="toggleFeature('swing')">SWING</button>
        <button id="btn-humanize" onclick="toggleFeature('humanize')">HUMANIZE</button>
    </div>

    <div id="grid" class="grid"></div>

<script>
    // Estado del Sistema
    const features = { shuffle: false, velocity: false, swing: false, humanize: false };
    let isPlaying = false;

    // Conexión de Botones
    function toggleFeature(featureName) {
        features[featureName] = !features[featureName];
        const btn = document.getElementById(`btn-${featureName}`);
        btn.classList.toggle('active', features[featureName]);
        console.log(`Función ${featureName} activada: ${features[featureName]}`);
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        document.getElementById('btn-play').classList.toggle('active', isPlaying);
        console.log(`Estado Play: ${isPlaying}`);
        // Aquí entraría la lógica del scheduler
    }

    // Inicializar Rejilla
    const grid = document.getElementById('grid');
    for(let i = 0; i < 16; i++) {
        const s = document.createElement('div');
        s.className = 'step';
        s.onclick = () => s.classList.toggle('active');
        grid.appendChild(s);
    }
</script>
</body>
</html>
